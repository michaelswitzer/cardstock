name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # Go cross-compiles every platform, so one Linux runner builds all archives.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build & package
        run: npm run release

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/dist/*.zip
            app/dist/*.tar.gz
